services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: csa-voting
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Redis behind an Upstash-compatible REST API, for the results cache in
  # end-to-end tests: docker compose --profile e2e up -d
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: [e2e]

  redis-http:
    image: hiett/serverless-redis-http:0.0.10
    restart: unless-stopped
    profiles: [e2e]
    ports:
      - 8079:80
    environment:
      SRH_MODE: env
      SRH_TOKEN: e2e-redis-token
      SRH_CONNECTION_STRING: redis://redis:6379
    depends_on:
      - redis

volumes:
  db:
